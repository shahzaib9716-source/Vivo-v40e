
name: Build Haven APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Parent-child synchronization regression tests
        run: npm run test:sync

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run lint
      - run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-haven "npm run test:rules"
      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@19.1.0 build --platform android --profile preview --non-interactive --wait
