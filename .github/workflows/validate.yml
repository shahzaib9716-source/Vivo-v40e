name: Validate Haven

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haven-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Verify npm registry connectivity
        shell: bash
        run: |
          node --version
          npm --version
          npm config get registry
          node -e "require('dns').promises.lookup('registry.npmjs.org').then(x => console.log(x)).catch(e => { console.error(e); process.exitCode = 1 })"
      - name: Install locked dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_fetch_retries: '5'
          npm_config_fetch_retry_mintimeout: '20000'
          npm_config_fetch_retry_maxtimeout: '120000'
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: TypeScript validation
        run: npm run typecheck
      - name: Synchronization regression tests
        run: npm run test:sync


  native-device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install expo prebuild --platform android --no-install
      - run: ./gradlew :haven-device:testDebugUnitTest
        working-directory: android

  live-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npx --yes firebase-tools@15.37.0 emulators:exec --only firestore,auth --project demo-haven "npm run test:live"
